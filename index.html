<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf4ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitFlow">
  <meta name="description" content="An offline-friendly fitness, habits, water and workout tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>FitFlow — Your Fitness Dashboard</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><div class="brand-title">fitflow<span>.</span></div><div class="brand-sub">YOUR FITNESS SPACE</div></div>
      </div>
      <div class="sidebar-month">
        <div class="sidebar-month-label">YOUR TRACKER</div>
        <strong id="sidebarMonth">November 2026</strong>
        <div class="tiny-month" id="sidebarMonthGrid"></div>
      </div>
      <div class="side-section-label">MENU</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-link active" data-nav="today" type="button"><span class="nav-glyph">⌂</span><span>Dashboard</span></button>
        <button class="nav-link" data-nav="habits" type="button"><span class="nav-glyph">▦</span><span>Habit calendar</span></button>
        <button class="nav-link" data-nav="workouts" type="button"><span class="nav-glyph">◈</span><span>Workout log</span></button>
        <button class="nav-link" data-nav="progress" type="button"><span class="nav-glyph">↗</span><span>Progress</span></button>
        <button class="nav-link" data-nav="settings" type="button"><span class="nav-glyph">⚙</span><span>Settings</span></button>
      </nav>
      <div class="side-spacer"></div>
      <div class="quote-card"><span class="quote-star">✳</span><div>trust<br>the<br>process<span>.</span></div><p>Small steps. Stronger every day.</p></div>
      <div class="sidebar-foot"><span class="online-dot"></span> Stored privately on this device</div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left"><span class="crumb">FITNESS JOURNAL</span><span class="crumb-divider">/</span><strong id="pageCrumb">Dashboard</strong></div>
        <div class="topbar-right"><span class="topbar-date" id="todayLabel"></span><button id="themeButton" type="button" class="icon-button" aria-label="Toggle dark mode" title="Dark mode">☾</button><button type="button" class="btn btn-primary top-add" data-open-habit>+ Add habit</button></div>
      </header>
      <main id="pageRoot" class="page-root" aria-live="polite"></main>
      <footer class="footer">Made for better days <span>✦</span> FitFlow · Your data stays with you</footer>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button data-nav="today" class="bottom-link active" type="button"><span>⌂</span>Today</button>
    <button data-nav="habits" class="bottom-link" type="button"><span>▦</span>Habits</button>
    <button data-nav="workouts" class="bottom-link" type="button"><span>◈</span>Workout</button>
    <button data-nav="progress" class="bottom-link" type="button"><span>↗</span>Progress</button>
    <button data-nav="settings" class="bottom-link" type="button"><span>⚙</span>Settings</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="habitDialog" class="app-dialog">
    <form id="habitForm" class="dialog-body">
      <div class="dialog-head"><div><span class="eyebrow">PERSONALIZE YOUR ROUTINE</span><h2 id="habitDialogTitle">New habit</h2></div><button type="button" class="x-button" data-close-dialog aria-label="Close">×</button></div>
      <input type="hidden" id="habitId">
      <label class="field-label" for="habitName">Habit name</label><input class="field-input" id="habitName" placeholder="e.g. 10,000 steps" maxlength="45" required>
      <label class="field-label" for="habitIcon">Icon</label><select class="field-input" id="habitIcon"><option value="🏋️">🏋️ Strength</option><option value="🚶">🚶 Steps</option><option value="💧">💧 Water</option><option value="🥗">🥗 Nutrition</option><option value="🌙">🌙 Sleep</option><option value="🧘">🧘 Mindfulness</option><option value="⚡">⚡ Energy</option><option value="📖">📖 Learning</option><option value="❤️">❤️ Health</option><option value="✨">✨ General</option></select>
      <label class="field-label" for="habitColor">Color</label><select class="field-input" id="habitColor"><option value="blue">Sky blue</option><option value="pink">Soft pink</option><option value="mint">Mint green</option><option value="yellow">Sunny yellow</option><option value="purple">Lilac</option></select>
      <div class="dialog-actions"><button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button><button type="submit" class="btn btn-primary">Save habit</button></div>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
